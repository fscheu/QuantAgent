id: deriva-pre-fomc
idea: El exceso de retorno de las acciones de EE.UU. se concentra en los días de anuncio
  programado de la FOMC.
clase: pre-fomc
ventana:
  tenencia: del cierre del día hábil previo al cierre del día del anuncio programado
  calendario: anuncios FOMC programados, publicados de antemano
hipotesis_economica: En los anuncios macro programados se resuelve riesgo sistemático,
  y los inversores exigen una prima por cargar con él. Por eso una fracción grande
  de la prima de mercado se cobra en esos días. La fecha la fija la Fed por adelantado,
  así que no hay nada que calibrar.
fuente:
- 10.1111/jofi.12196
- 10.1017/S0022109013000410
universo:
  activos:
  - SPY
  criterio: El índice amplio de acciones de EE.UU. (S&P 500), que es el activo sobre
    el que Lucca y Moench miden la deriva.
parametros_libres: 0
