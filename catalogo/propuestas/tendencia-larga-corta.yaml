# Propuesta sin aprobar (familia F2 de docs/02_planning/2026-10-20_investigacion_edge_y_generacion.md).
# Datos: los del snapshot etf-1d-2026-10-amplio y DGS3MO de macro-2026-10, sin costo. Hace falta que la
# cartera admita celdas cortas (ticket R11); en Alpaca, cuenta margin con al menos USD 2.000 y solo ETFs
# fáciles de tomar en préstamo.
# Intentos: 1 cartera, 1 fila de intentos.csv por etapa corrida (hasta 3). Es la tercera cartera con la
# prima de tendencia: comparte grupo con cartera-tendencia-momentum en el N efectivo si las curvas se parecen.
# Contaminación: se propone sabiendo que en 2022 la tendencia con cortos ganó, y la investigación de datos del
# documento (§2.5) calculó con series de AQR la tendencia por clase de activo en 2019-2022; 2019-2022 no es una
# prueba ciega para esta propuesta. Rol sugerido: diversificador.
# El universo incluye DBC y USO, que son PTP: con rotación mensual, no pasa a dinero real hasta cerrar R15
# (retención del 10 % sobre ventas de PTP en cuentas extranjeras).
id: tendencia-larga-corta
idea: El signo del retorno de 12 meses en exceso de la tasa corta anticipa el del mes
  siguiente, en las subas y en las bajas.
clase: tsmom-largo-corto
ventana:
  lookback: [252]
  tasa_corta: [DGS3MO]
hipotesis_economica: Los precios incorporan la información de a poco y después sobrerreaccionan,
  y los coberturistas pagan por transferir riesgo; por eso el retorno de 12 meses anticipa
  el del mes siguiente en las dos direcciones (Moskowitz, Ooi y Pedersen 2012, en 58
  futuros; Hurst, Ooi y Pedersen 2017, en más de un siglo). La cita define la estrategia
  larga y corta, en exceso de la tasa corta. La versión solo larga que ya se probó
  se queda en efectivo justo en las caídas largas, que es donde la prima paga. El benchmark
  comprado no tiene lado corto, así que esta cartera trae una fuente de retorno que
  1/N no tiene. Decisión en la última sesión de cada mes; largo si el retorno de 252
  sesiones supera al de las letras del Tesoro a 3 meses del mismo período, corto si
  no; pesos de la cartera por 1/σ, que aproximan el escalado por volatilidad de la cita.
fuente:
- 10.1016/j.jfineco.2011.11.003
- 10.3905/jpm.2017.44.1.015
universo:
  activos:
  - AGG
  - DBC
  - EEM
  - EFA
  - EWJ
  - EWZ
  - FXE
  - FXI
  - GLD
  - IEF
  - IWM
  - LQD
  - QQQ
  - SHY
  - SLV
  - SPY
  - TIP
  - TLT
  - USO
  - VNQ
  - XLB
  - XLE
  - XLF
  - XLI
  - XLK
  - XLP
  - XLU
  - XLV
  - XLY
  criterio: Los mismos 29 ETFs de cartera-tendencia-momentum; la tendencia vale en cualquier
    activo líquido y la única diferencia con lo ya probado es el lado corto, que la cita
    incluye. Fijado antes de correr.
parametros_libres: 0
clase_nueva: false
tema: tendencia
fuente_de_retorno: prima-de-riesgo
por_que_no_esta_en_el_benchmark: El benchmark permanece comprado; esta cartera mantiene posiciones cortas cuando la tendencia es negativa.
cita_texto:
- Moskowitz, Ooi y Pedersen (2012). Time Series Momentum
- Hurst, Ooi y Pedersen (2017). A Century of Evidence on Trend-Following Investing
muestra_de_la_cita: 1985-2015
evidencia_posterior: []
fidelidad: igual a la cita en la dirección larga-corta; ETFs y ponderación inversa a volatilidad son adaptación declarada.
datos_nuevos: []
efecto_esperado: ΔSharpe positivo contra el benchmark por la pata corta; mitad del efecto publicado descontada.
