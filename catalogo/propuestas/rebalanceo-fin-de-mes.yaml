# F1 aprobada: decisión 7 de docs/04_decisions/QuantAgent-R01-DC-decisiones-investigacion-edge.md.
# Datos: los del snapshot etf-1d-2026-10-amplio (SPY, IEF), sin costo. La estrategia registrada expone
# los pesos objetivo por fecha; el llenado al cierre corresponde a QuantAgent-e4jc.2.3.
# Intentos: 1 cartera, 1 fila de intentos.csv por etapa corrida (hasta 3).
# QuantAgent-e4jc.1: verificado en la versión NBER de marzo de 2025 (no la revisión de 2026).
# PDF: https://d1e00ek4ebabms.cloudfront.net/production/uploaded-files/w33554-c27954c3-8c17-44f5-a26f-1800436b6ebf.pdf
# §2.2, pp. 10–11 (PDF 12–13): week4 = Dummy5 Days, últimos cinco días de negociación,
# no cuarta semana del calendario. §3.1, p. 13 (PDF 15), usa week4_t para predecir Ret_{t+1}.
# §5, p. 32 (PDF 34), expresa la cartera como R_t, con señal conocida desde t-1 (§2.2, p. 8).
# Convención de F1 para esos cinco retornos diarios: entrar al cierre de la sesión anterior
# a la quinta sesión contando desde fin de mes; salir al cierre de la última. Recalcular cada día
# con el cierre previo; no fijar la dirección toda la semana ni usar el cierre futuro de entrada.
# Ejemplo F1: octubre de 2024, entrada 24/10, retornos 25, 28, 29, 30 y 31/10, salida 31/10.
# Activos del paper: futuros E-mini S&P 500 y Treasury note a 10 años (apéndice A, p. 44 / PDF 46).
# Muestra: 1997-09-10 a 2023-03-17 (tabla 7, p. 33 / PDF 35); etapas 2 y 3 son réplica.
# La reserva 2023+ se solapa hasta 2023-03-17; ese tramo tampoco es evidencia fuera de muestra.
id: rebalanceo-fin-de-mes
idea: Los fondos que rebalancean hacia pesos fijos de acciones y bonos venden a fin de
  mes el activo que más subió en el mes, y esa venta predecible baja su retorno en
  los últimos días hábiles.
clase: rebalanceo-fin-de-mes
ventana:
  peso_acciones_referencia: [0.6]
  dias_habiles_antes_de_fin_de_mes: [5]
  peso_base: [0.5]
hipotesis_economica: Pensiones, fondos con fecha objetivo y otros fondos balanceados
  (unos 20 billones de dólares según los autores) vuelven a pesos fijos de acciones
  y bonos en fechas conocidas. Si en el mes las acciones le ganaron a los bonos, tienen
  que vender acciones y comprar bonos cerca del cierre de mes, y al revés si perdieron.
  Esa presión baja el retorno del ganador del mes al día siguiente y se disuelve en
  unas dos semanas; quien toma el otro lado le cobra la liquidez. La señal sale solo
  de los retornos del mes, la contraparte tiene mandatos que le impiden dejar de hacerlo,
  y el benchmark (50 % SPY y 50 % IEF comprados) no tiene esta fuente de retorno. La
  regla de F1 usa una cartera de referencia 60/40 que deriva desde el último cierre
  de mes. Para cada uno de los últimos 5 retornos diarios del mes, si el peso de acciones
  al cierre previo supera el 60 %, se está 100 % en IEF; si es menor, 100 % en SPY;
  si es igual, 50/50. El resto del mes, 50/50 como el benchmark.
fidelidad: 'desvío: SPY/IEF sustituyen futuros; F1 usa solo Calendar y posiciones largas
  100/0 o 50/50, con la convención de cierres indicada arriba. La estrategia del paper
  (§5, p. 32) combina Threshold y Calendar, toma futuros largos y cortos y agrega
  una señal de reversión el primer día hábil del mes; F1 omite esa reversión.'
fuente:
- 10.3386/w33554
- 10.1093/rfs/hhz054
universo:
  activos:
  - SPY
  - IEF
  criterio: Los equivalentes en ETF de los dos activos sobre los que Harvey, Mazzoleni
    y Melone miden la presión, el futuro del S&P 500 y el futuro del bono del Tesoro
    a 10 años. Fijado antes de correr; no se agregan otros ETFs de acciones o bonos.
parametros_libres: 0
