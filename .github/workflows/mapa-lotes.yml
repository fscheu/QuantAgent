name: Mapa de lotes

on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches:
      - main
      - 'lote/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: mapa-lotes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate map
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          python3 docs/mapa/generar_mapa.py \
            --issues .beads/issues.jsonl \
            --lotes docs/mapa/lotes.json \
            --sessions docs/mapa/sessions.json \
            --out site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
