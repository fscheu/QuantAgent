name: lote-automerge

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["Main CI + Deploy QA"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
        type: string
      dry_run:
        description: Only print the decision
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

jobs:
  resolve:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, 'PM:'))
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.prs.outputs.prs }}
    steps:
      - name: Resolve PR numbers
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_PR: ${{ github.event.issue.number }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr }}
          RUN_HEAD: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          event = os.environ['EVENT_NAME']
          if event == 'workflow_run':
              result = subprocess.run(
                  ['gh', 'pr', 'list', '--repo', os.environ['GH_REPO'], '--state', 'open',
                   '--head', os.environ['RUN_HEAD'], '--limit', '1000', '--json', 'number,headRefOid'],
                  check=True, capture_output=True, text=True)
              prs = [p['number'] for p in json.loads(result.stdout)
                     if p['headRefOid'] == os.environ['RUN_SHA']]
          else:
              key = {'issue_comment': 'ISSUE_PR', 'pull_request_review': 'REVIEW_PR',
                     'workflow_dispatch': 'INPUT_PR'}[event]
              prs = [int(os.environ[key])]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('prs=' + json.dumps(prs) + '\n')
          PY

  automerge:
    needs: resolve
    if: needs.resolve.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.resolve.outputs.prs) }}
    concurrency:
      group: lote-automerge-${{ github.repository }}-${{ matrix.pr }}
      cancel-in-progress: false
    steps:
      - name: Checkout default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate and merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(--repo "$GH_REPO" --pr "$PR_NUMBER")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 scripts/loop/automerge.py "${args[@]}"
