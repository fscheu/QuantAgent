name: Main CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.beads/**'
  # PRs toward main or a lot branch run lint + tests only; deploy and Telegram notices stay push-only.
  pull_request:
    branches: [main, 'lote/**']
    paths-ignore:
      - 'docs/**'
      - '.beads/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  ci:
    name: CI (Lint + Tests)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: quantagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          # TA-Lib
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff
      
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/quantagent_test
        run: |
          python - <<'PY'
          import os
          import time
          from sqlalchemy import create_engine, text

          url = os.environ["DATABASE_URL"]
          last_error = None
          for attempt in range(1, 13):
              try:
                  engine = create_engine(url, pool_pre_ping=True)
                  with engine.connect() as conn:
                      conn.execute(text("SELECT 1"))
                  print(f"Postgres auth/query check passed on attempt {attempt}")
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Postgres not ready for Alembic yet (attempt {attempt}/12): {exc}")
                  time.sleep(5)
          else:
              raise last_error
          PY
          python -m alembic upgrade head
      
      - name: Lint with ruff (autofix + check)
        id: lint
        run: |
          ruff check quantagent/ --fix
          ruff check quantagent/ --output-format=github
        continue-on-error: true
      
      - name: Run unit tests
        id: tests
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/quantagent_test
        run: |
          pytest tests/ -v --tb=short --maxfail=10 \
            -m "not integration and not slow"

      - name: Determine overall status
        id: status
        env:
          LINT_EXIT: ${{ steps.lint.outcome }}
          TESTS_EXIT: ${{ steps.tests.outcome || 'skipped' }}
        run: |
          if [[ "$LINT_EXIT" != "success" ]]; then
            echo "failed_step=Lint" >> $GITHUB_OUTPUT
            exit 1
          fi

          if [[ "$TESTS_EXIT" != "success" && "$TESTS_EXIT" != "skipped" ]]; then
            echo "failed_step=Unit tests" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "All checks passed"
      
      - name: Notify Telegram on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1 | tr '"' "'")
          FAILED_STEP="${{ steps.status.outputs.failed_step || 'Unknown' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"-1003835130753\",
              \"message_thread_id\": 208,
              \"text\": \"🚨 CI Failure\\n\\nCommit: ${COMMIT_SHA}\\nMessage: ${COMMIT_MSG}\\nFailed step: ${FAILED_STEP}\\nLogs: ${RUN_URL}\\n\\n@openclaw Run ID: ${{ github.run_id }}\",
              \"disable_web_page_preview\": true
            }"
      
      - name: Notify Telegram on success
        if: success() && github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1 | tr '"' "'")
          
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"-1003835130753\",
              \"message_thread_id\": 208,
              \"text\": \"✅ CI passed\\n\\nCommit: ${COMMIT_SHA}\\nMessage: ${COMMIT_MSG}\",
              \"disable_web_page_preview\": true
            }"
  
