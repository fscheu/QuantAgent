name: Main CI + Deploy QA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  ci:
    name: CI (Lint + Tests)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: quantagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          # TA-Lib
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff
      
      - name: Lint with ruff (autofix + check)
        id: lint
        run: |
          ruff check quantagent/ --fix
          ruff check quantagent/ --output-format=github
        continue-on-error: true
      
      # Unit tests temporarily disabled (tracked for later deep dive)
      # - name: Run unit tests
      #   id: tests
      #   env:
      #     DATABASE_URL: postgresql://test:test@localhost:5432/quantagent_test
      #   run: |
      #     pytest tests/ -v --tb=short --maxfail=5 \
      #       -m "not integration and not slow"
      #   continue-on-error: true
      
      - name: Determine overall status
        id: status
        env:
          LINT_EXIT: ${{ steps.lint.outcome }}
          TESTS_EXIT: ${{ steps.tests.outcome || 'skipped' }}
        run: |
          if [[ "$LINT_EXIT" != "success" ]]; then
            echo "failed_step=Lint" >> $GITHUB_OUTPUT
            exit 1
          fi

          if [[ "$TESTS_EXIT" != "success" && "$TESTS_EXIT" != "skipped" ]]; then
            echo "failed_step=Unit tests" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "All checks passed"
      
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1 | tr '"' "'")
          FAILED_STEP="${{ steps.status.outputs.failed_step || 'Unknown' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"-1003835130753\",
              \"message_thread_id\": 208,
              \"text\": \"🚨 CI Failure\\n\\nCommit: ${COMMIT_SHA}\\nMessage: ${COMMIT_MSG}\\nFailed step: ${FAILED_STEP}\\nLogs: ${RUN_URL}\\n\\n@openclaw Run ID: ${{ github.run_id }}\",
              \"disable_web_page_preview\": true
            }"
      
      - name: Notify Telegram on success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1 | tr '"' "'")
          
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"-1003835130753\",
              \"message_thread_id\": 208,
              \"text\": \"✅ CI passed\\n\\nCommit: ${COMMIT_SHA}\\nMessage: ${COMMIT_MSG}\",
              \"disable_web_page_preview\": true
            }"
  
  deploy-qa:
    name: Deploy to QA
    needs: ci
    runs-on: [self-hosted, Linux, X64, quantagent-vm]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to QA locally
        id: deploy
        run: |
          cd ~/repos/projects/QuantAgent
          git fetch origin
          git reset --hard origin/main
          sudo docker-compose -f docker-compose.qa.yml down || true
          sudo docker-compose -f docker-compose.qa.yml build --no-cache
          sudo docker-compose -f docker-compose.qa.yml up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Health check
        id: health
        run: |
          for i in {1..10}; do
            if curl -f https://qa.fedes.dev/health; then
              echo "QA environment is healthy"
              exit 0
            fi
            echo "Attempt $i/10 failed, waiting..."
            sleep 10
          done
          echo "Health check failed after 10 attempts"
          exit 1

      - name: Notify Hermes Tech Lead
        if: always()
        env:
          HERMES_WEBHOOK_URL: http://localhost:8644/webhooks/github-deploy-finished
          HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          import hmac
          import os
          import urllib.request

          url = os.environ["HERMES_WEBHOOK_URL"]
          secret = os.environ["HERMES_WEBHOOK_SECRET"]
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")

          payload = {
              "event_type": "deploy_finished",
              "repo": repo,
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "job": os.environ.get("GITHUB_JOB", ""),
              "environment": "qa",
              "ref": os.environ.get("GITHUB_REF", ""),
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "actor": os.environ.get("GITHUB_ACTOR", ""),
              "conclusion": os.environ.get("JOB_STATUS", ""),
              "run_id": run_id,
              "run_attempt": run_attempt,
              "run_url": f"https://github.com/{repo}/actions/runs/{run_id}",
              "deployed_url": "https://qa.fedes.dev",
              "deploy_step_outcome": os.environ.get("DEPLOY_OUTCOME", ""),
              "health_step_outcome": os.environ.get("HEALTH_OUTCOME", ""),
          }

          body = json.dumps(payload).encode("utf-8")
          signature = hmac.new(secret.encode("utf-8"), body, hashlib.sha256).hexdigest()

          request = urllib.request.Request(url, data=body, method="POST")
          request.add_header("Content-Type", "application/json")
          request.add_header("X-Webhook-Signature", signature)
          request.add_header("X-Request-ID", f"github-actions-{run_id}-{run_attempt}")

          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status)
              print(response.read().decode())
          PY
