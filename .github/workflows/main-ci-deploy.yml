name: Main CI + Deploy QA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.beads/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  ci:
    name: CI (Lint + Tests)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: quantagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          # TA-Lib
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff
      
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/quantagent_test
        run: |
          python - <<'PY'
          import os
          import time
          from sqlalchemy import create_engine, text

          url = os.environ["DATABASE_URL"]
          last_error = None
          for attempt in range(1, 13):
              try:
                  engine = create_engine(url, pool_pre_ping=True)
                  with engine.connect() as conn:
                      conn.execute(text("SELECT 1"))
                  print(f"Postgres auth/query check passed on attempt {attempt}")
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Postgres not ready for Alembic yet (attempt {attempt}/12): {exc}")
                  time.sleep(5)
          else:
              raise last_error
          PY
          python -m alembic upgrade head
      
      - name: Lint with ruff (autofix + check)
        id: lint
        run: |
          ruff check quantagent/ --fix
          ruff check quantagent/ --output-format=github
        continue-on-error: true
      
      - name: Run unit tests
        id: tests
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/quantagent_test
        run: |
          pytest tests/ -v --tb=short --maxfail=10 \
            -m "not integration and not slow"

      - name: Determine overall status
        id: status
        env:
          LINT_EXIT: ${{ steps.lint.outcome }}
          TESTS_EXIT: ${{ steps.tests.outcome || 'skipped' }}
        run: |
          if [[ "$LINT_EXIT" != "success" ]]; then
            echo "failed_step=Lint" >> $GITHUB_OUTPUT
            exit 1
          fi

          if [[ "$TESTS_EXIT" != "success" && "$TESTS_EXIT" != "skipped" ]]; then
            echo "failed_step=Unit tests" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "All checks passed"
      
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1 | tr '"' "'")
          FAILED_STEP="${{ steps.status.outputs.failed_step || 'Unknown' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"-1003835130753\",
              \"message_thread_id\": 208,
              \"text\": \"🚨 CI Failure\\n\\nCommit: ${COMMIT_SHA}\\nMessage: ${COMMIT_MSG}\\nFailed step: ${FAILED_STEP}\\nLogs: ${RUN_URL}\\n\\n@openclaw Run ID: ${{ github.run_id }}\",
              \"disable_web_page_preview\": true
            }"
      
      - name: Notify Telegram on success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1 | tr '"' "'")
          
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"-1003835130753\",
              \"message_thread_id\": 208,
              \"text\": \"✅ CI passed\\n\\nCommit: ${COMMIT_SHA}\\nMessage: ${COMMIT_MSG}\",
              \"disable_web_page_preview\": true
            }"
  
  deploy-qa:
    name: Deploy to QA
    needs: ci
    runs-on: [self-hosted, Linux, X64, quantagent-vm]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reset QA validator run artifacts
        run: |
          rm -rf /home/azureuser/.hermes/runs/autodev-qa-validator/poc-qa-validator-local-streamlit-8501

      - name: Deploy to QA locally
        id: deploy
        run: |
          cd ~/repos/projects/QuantAgent
          git fetch origin
          git reset --hard origin/main
          sudo docker image prune -af || true
          sudo docker container prune -f || true
          sudo docker builder prune -af || true
          sudo docker compose -f docker-compose.qa.yml down --remove-orphans || true
          sudo docker compose -f docker-compose.qa.yml build --no-cache
          sudo docker compose -f docker-compose.qa.yml up -d
          echo "Waiting for services to be healthy..."
          sleep 20

      - name: Apply QA database migrations
        id: migrate
        run: |
          cd ~/repos/projects/QuantAgent
          sudo docker exec quantagent_qa python -m alembic upgrade head
          sudo docker exec quantagent_qa_db psql -U qa_user -d quantagent_qa -c '\dt'

      - name: Bootstrap minimal QA dataset
        id: bootstrap
        run: |
          cd ~/repos/projects/QuantAgent
          sudo docker exec quantagent_qa python scripts/bootstrap_qa_minimal.py --reset
          sudo docker exec quantagent_qa_db psql -U qa_user -d quantagent_qa -c "select 'orders' as table, count(*) from orders union all select 'trades', count(*) from trades union all select 'logs', count(*) from logs union all select 'scheduler_heartbeats', count(*) from scheduler_heartbeats union all select 'active_positions', count(*) from active_positions;"

      - name: Health check
        id: health
        run: |
          for i in {1..18}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo "QA Streamlit is healthy"
              exit 0
            fi
            echo "Attempt $i/18 failed, waiting..."
            sleep 10
          done
          echo "Health check failed after 18 attempts"
          exit 1

      - name: Verify pinned QA validator artifacts
        id: qa_validator_integrity
        run: |
          printf '%s  %s\n' \
            '1f08a837b16e35f77108c3a557fde706e6574721ff07c59677644a1d90edd689' '/home/azureuser/.hermes/skills/autodev/autodev-qa-validator/scripts/runner.py' \
            'b7386381ca56052f2d63e2a938099a0a8e373110b72dc9793bbfe8bb8ec52db7' '/home/azureuser/.hermes/skills/autodev/autodev-qa-validator/templates/local-streamlit.yaml' \
            'baa64d7647d15c51b87198648a4e115f5dd6b9e502d7709bdc0a53d5374f58ae' '/home/azureuser/.hermes/skills/autodev/autodev-qa-validator/templates/prompt_template.md' \
            'e3b6a8a9daa88d70b014048209b03729c56c5807ba75c15e726077059de9c775' '/home/azureuser/.hermes/skills/autodev/autodev-qa-validator/references/poc-docs/local-streamlit-target.md' \
            | sha256sum -c -

      - name: Verify QA validator target alignment
        id: qa_target_alignment
        run: |
          CONFIG=/home/azureuser/.hermes/skills/autodev/autodev-qa-validator/templates/local-streamlit.yaml
          echo "=== Validator config target lines ==="
          grep -Ei 'url|target|host|port' "$CONFIG" | head -10 || echo "(no matching lines found)"
          echo "==="
          if grep -q '8501' "$CONFIG"; then
            echo "TARGET_ALIGNED=true — validator config references port 8501 (QA Streamlit runtime)"
          else
            echo "ERROR: Validator config does not reference port 8501."
            echo "Deployed QA target: http://127.0.0.1:8501"
            echo "This is a target drift condition — aborting to prevent validating the wrong runtime."
            exit 1
          fi

      - name: Run post-deploy QA validator
        id: qa_validator
        continue-on-error: true
        run: |
          cd ~/repos/projects/QuantAgent
          python3 /home/azureuser/.hermes/skills/autodev/autodev-qa-validator/scripts/runner.py \
            --config /home/azureuser/.hermes/skills/autodev/autodev-qa-validator/templates/local-streamlit.yaml

      - name: Read QA validator verdict
        id: qa_validator_result
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          run_dir = Path('/home/azureuser/.hermes/runs/autodev-qa-validator/poc-qa-validator-local-streamlit-8501')
          result_path = run_dir / 'result.json'
          report_path = run_dir / 'run-report.md'

          status = 'MISSING'
          if result_path.exists():
              try:
                  status = json.loads(result_path.read_text()).get('status', 'MISSING')
              except Exception:
                  status = 'INVALID'

          # Collect evidence artifacts
          artifacts = []
          if result_path.exists():
              artifacts.append('result.json')
          if report_path.exists():
              artifacts.append('run-report.md')
          for p in sorted(run_dir.glob('**/*')):
              if p.is_file() and p.suffix in ('.png', '.jpg', '.html', '.log'):
                  artifacts.append(str(p.relative_to(run_dir)))

          artifacts_count = len(artifacts)
          artifacts_list = ','.join(artifacts)

          # Print run-report summary if available
          if report_path.exists():
              lines = report_path.read_text().splitlines()[:30]
              print('=== run-report.md (first 30 lines) ===')
              print('\n'.join(lines))
              print('===')

          print(f'Validator status: {status}')
          print(f'Artifacts present ({artifacts_count}): {artifacts_list}')

          # qa_verified: only SUCCESS qualifies as fully verified
          # qa_partial:  PARTIAL means infra up but some functional coverage incomplete
          qa_verified = str(status == 'SUCCESS').lower()
          qa_partial = str(status == 'PARTIAL').lower()

          with open(Path.cwd() / '.github_output_tmp', 'w', encoding='utf-8') as f:
              f.write(f'qa_validator_result_status={status}\n')
              f.write(f'qa_verified={qa_verified}\n')
              f.write(f'qa_partial={qa_partial}\n')
              f.write(f'validator_artifacts_count={artifacts_count}\n')
              f.write(f'validator_artifacts_list={artifacts_list}\n')
          PY
          cat .github_output_tmp >> "$GITHUB_OUTPUT"
          rm -f .github_output_tmp

      - name: Upload QA validator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-validator-${{ github.run_id }}-${{ steps.qa_validator_result.outputs.qa_validator_result_status || 'MISSING' }}
          path: /home/azureuser/.hermes/runs/autodev-qa-validator/poc-qa-validator-local-streamlit-8501/
          if-no-files-found: warn
          retention-days: 30

      - name: Notify Hermes Tech Lead
        if: always()
        env:
          HERMES_WEBHOOK_URL: http://localhost:8644/webhooks/github-deploy-finished
          HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migrate.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          QA_TARGET_ALIGNMENT_OUTCOME: ${{ steps.qa_target_alignment.outcome }}
          QA_VALIDATOR_OUTCOME: ${{ steps.qa_validator.outcome }}
          QA_VALIDATOR_RESULT_STATUS: ${{ steps.qa_validator_result.outputs.qa_validator_result_status }}
          QA_VERIFIED: ${{ steps.qa_validator_result.outputs.qa_verified }}
          QA_PARTIAL: ${{ steps.qa_validator_result.outputs.qa_partial }}
          VALIDATOR_ARTIFACTS_COUNT: ${{ steps.qa_validator_result.outputs.validator_artifacts_count }}
          VALIDATOR_ARTIFACTS_LIST: ${{ steps.qa_validator_result.outputs.validator_artifacts_list }}
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          import hmac
          import os
          import urllib.request

          url = os.environ["HERMES_WEBHOOK_URL"]
          secret = os.environ["HERMES_WEBHOOK_SECRET"]
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")

          payload = {
              "event_type": "deploy_finished",
              "repo": repo,
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "job": os.environ.get("GITHUB_JOB", ""),
              "environment": "qa",
              "ref": os.environ.get("GITHUB_REF", ""),
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "actor": os.environ.get("GITHUB_ACTOR", ""),
              "conclusion": os.environ.get("JOB_STATUS", ""),
              "run_id": run_id,
              "run_attempt": run_attempt,
              "run_url": f"https://github.com/{repo}/actions/runs/{run_id}",
              "deployed_url": "https://qa.fedes.dev",
              "deploy_step_outcome": os.environ.get("DEPLOY_OUTCOME", ""),
              "migration_step_outcome": os.environ.get("MIGRATION_OUTCOME", ""),
              "bootstrap_step_outcome": os.environ.get("BOOTSTRAP_OUTCOME", ""),
              "health_step_outcome": os.environ.get("HEALTH_OUTCOME", ""),
              "qa_target_alignment_outcome": os.environ.get("QA_TARGET_ALIGNMENT_OUTCOME", ""),
              "qa_validator_step_outcome": os.environ.get("QA_VALIDATOR_OUTCOME", ""),
              "qa_validator_result_status": os.environ.get("QA_VALIDATOR_RESULT_STATUS", ""),
              "qa_verified": os.environ.get("QA_VERIFIED", "false"),
              "qa_partial": os.environ.get("QA_PARTIAL", "false"),
              "validator_artifacts_count": os.environ.get("VALIDATOR_ARTIFACTS_COUNT", "0"),
              "validator_artifacts_list": os.environ.get("VALIDATOR_ARTIFACTS_LIST", ""),
          }

          body = json.dumps(payload).encode("utf-8")
          signature = hmac.new(secret.encode("utf-8"), body, hashlib.sha256).hexdigest()

          request = urllib.request.Request(url, data=body, method="POST")
          request.add_header("Content-Type", "application/json")
          request.add_header("X-Webhook-Signature", signature)
          request.add_header("X-Request-ID", f"github-actions-{run_id}-{run_attempt}")

          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status)
              print(response.read().decode())
          PY
