[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantagent"
version = "0.1.0"
description = "Multi-agent trading analysis system using vision-capable LLMs"
authors = [{name = "QuantAgent Team"}]
requires-python = ">=3.9"
dependencies = [
    "flask",
    "click>=8.1",
    "yfinance",
    "pandas",
    "numpy",
    "matplotlib",
    "mplfinance",
    "scipy",
    "TA-Lib",
    "tabulate>=0.9",
    "APScheduler>=3.10.0,<4.0.0",
    "langchain",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-qwq",
    "langchain-core",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "openai",
    "anthropic",
    "ipython",
    "Pillow",
    "requests",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "psycopg[binary,pool]",
    "python-dotenv>=1.0.0",
    "streamlit",
    "pandas_market_calendars>=4.0.0,<5.0.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "pytest-xdist>=3.5",
    "black>=23.0",
    "ruff",
    "mypy>=1.5",
    "types-requests>=2.31",
    "backtesting>=0.6.6,<0.7",  # solo scripts/crossval_rsi.py (oraculo de cross-validation)
]

[tool.setuptools]
packages = ["quantagent", "apps"]

# Configuración de pytest centralizada en pytest.ini (fuente única de verdad)

[tool.ruff]
target-version = "py311"
fix = true
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # line length — too many long prompt strings; not auto-fixable

[tool.coverage.run]
source = ["quantagent"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
