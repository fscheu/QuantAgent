id: tendencia-larga-corta
idea: El signo del retorno de 12 meses en exceso de la tasa corta anticipa el del
  mes siguiente, en las subas y en las bajas.
clase: tsmom-largo-corto
ventana:
  lookback:
  - 252
  tasa_corta:
  - DGS3MO
parametros:
  snapshot:
  - macro-2026-10
hipotesis_economica: Los precios incorporan la información de a poco y después sobrerreaccionan,
  y los coberturistas pagan por transferir riesgo; por eso el retorno de 12 meses
  anticipa el del mes siguiente en las dos direcciones (Moskowitz, Ooi y Pedersen
  2012, en 58 futuros; Hurst, Ooi y Pedersen 2017, en más de un siglo). La cita define
  la estrategia larga y corta, en exceso de la tasa corta. La versión solo larga que
  ya se probó se queda en efectivo justo en las caídas largas, que es donde la prima
  paga. El benchmark comprado no tiene lado corto, así que esta cartera trae una fuente
  de retorno que 1/N no tiene. Decisión en la última sesión de cada mes; largo si
  el retorno de 252 sesiones supera al de las letras del Tesoro a 3 meses del mismo
  período, corto si no; pesos de la cartera por 1/σ, que aproximan el escalado por
  volatilidad de la cita.
fuente: 10.1016/j.jfineco.2011.11.003 ; 10.3905/jpm.2017.44.1.015
universo: Los mismos 29 ETFs de cartera-tendencia-momentum; la tendencia vale en cualquier
  activo líquido y la única diferencia con lo ya probado es el lado corto, que la
  cita incluye. Fijado antes de correr.
