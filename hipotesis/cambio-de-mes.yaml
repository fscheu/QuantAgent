id: cambio-de-mes
idea: El retorno de las acciones se concentra entre el último día hábil del mes y
  los tres primeros del mes siguiente.
clase: turn-of-the-month
ventana: &id001
  dia_inicio: -1
  dia_fin: 3
  rebalanceo: mensual
hipotesis_economica: Los flujos de caja que llegan a fin de mes (sueldos, aportes
  a fondos de pensión, dividendos) generan demanda concentrada de acciones. Ese pico
  de liquidez le paga una prima a quien tiene el riesgo en esos días. La ventana [-1,
  +3] es la que define la literatura y no se ajusta.
fuente: 10.1093/rfs/1.4.403 ; 10.2469/faj.v64.n2.11
universo: ETFs de índices amplios de acciones, de EE.UU. e internacionales, que es
  donde McConnell y Xu documentan el efecto. Quedan afuera los sectoriales porque
  la prima está definida sobre el mercado amplio.
parametros_libres: 0
autor: fede
timeframe: 1d
justificacion: Los flujos de caja que llegan a fin de mes (sueldos, aportes a fondos
  de pensión, dividendos) generan demanda concentrada de acciones. Ese pico de liquidez
  le paga una prima a quien tiene el riesgo en esos días. La ventana [-1, +3] es la
  que define la literatura y no se ajusta.
