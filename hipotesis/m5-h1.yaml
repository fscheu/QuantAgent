id: m5-h1
autor: fede
justificacion: >-
  H1 de la escalera M5: rotación semanal de ETFs sectoriales por momentum
  de precio. Cada semana se compran los 3 ETFs con mayor PriceMomentumScore
  (retorno de 1, 3 y 6 meses sobre volatilidad de 60 sesiones), solo si el
  score es mayor que 0, y la pierna queda en efectivo cuando SPY está en
  risk-off (bajo su SMA200 con la SMA decreciente frente a 20 sesiones). Pesos
  por igual riesgo (1/σ). Benchmark: 1/N del universo. Sin parámetros libres:
  k = 3, ventanas y filtro fijados en el diseño antes de correr.
fuente: docs/03_design/QuantAgent-M5-DS-motor-top-down.md §6.1 y §7 ; catalogo/m5-priors.yaml
timeframe: 1d
piernas:
  - clase: sector-score-h1
    parametros: {}
    elegibilidad: sin-caida-m5
    activos: [XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY, SPY, EEM, EWZ]
    universo: Los 14 ETFs de catalogo/m5-priors.yaml (11 sectores SPDR, SPY, EEM y EWZ) en un único ranking semanal.
