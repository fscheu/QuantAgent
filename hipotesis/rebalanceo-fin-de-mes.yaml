id: rebalanceo-fin-de-mes
idea: Los fondos que rebalancean hacia pesos fijos de acciones y bonos venden a fin
  de mes el activo que más subió en el mes, y esa venta predecible baja su retorno
  en los últimos días hábiles.
clase: rebalanceo-fin-de-mes
ventana: &id001
  peso_acciones_referencia:
  - 0.6
  dias_habiles_antes_de_fin_de_mes:
  - 5
  peso_base:
  - 0.5
hipotesis_economica: Pensiones, fondos con fecha objetivo y otros fondos balanceados
  (unos 20 billones de dólares según los autores) vuelven a pesos fijos de acciones
  y bonos en fechas conocidas. Si en el mes las acciones le ganaron a los bonos, tienen
  que vender acciones y comprar bonos cerca del cierre de mes, y al revés si perdieron.
  Esa presión baja el retorno del ganador del mes al día siguiente y se disuelve en
  unas dos semanas; quien toma el otro lado le cobra la liquidez. La señal sale solo
  de los retornos del mes, la contraparte tiene mandatos que le impiden dejar de hacerlo,
  y el benchmark (50 % SPY y 50 % IEF comprados) no tiene esta fuente de retorno.
  La regla de F1 usa una cartera de referencia 60/40 que deriva desde el último cierre
  de mes. Para cada uno de los últimos 5 retornos diarios del mes, si el peso de acciones
  al cierre previo supera el 60 %, se está 100 % en IEF; si es menor, 100 % en SPY;
  si es igual, 50/50. El resto del mes, 50/50 como el benchmark.
fidelidad: 'desvío: SPY/IEF sustituyen futuros; F1 usa solo Calendar y posiciones
  largas 100/0 o 50/50, con la convención de cierres indicada arriba. La estrategia
  del paper (§5, p. 32) combina Threshold y Calendar, toma futuros largos y cortos
  y agrega una señal de reversión el primer día hábil del mes; F1 omite esa reversión.'
fuente: 10.3386/w33554 ; 10.1093/rfs/hhz054
universo: Los equivalentes en ETF de los dos activos sobre los que Harvey, Mazzoleni
  y Melone miden la presión, el futuro del S&P 500 y el futuro del bono del Tesoro
  a 10 años. Fijado antes de correr; no se agregan otros ETFs de acciones o bonos.
